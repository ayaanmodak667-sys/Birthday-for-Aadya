<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!!!</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 30px;
        }

        h1 {
            color: #ff69b4;
        }

        .note {
            max-width: 600px;
            margin: 20px auto;
            font-size: 18px;
            line-height: 1.5;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .gallery img,
        .cake img {
            max-width: 300px;
            width: 90%;
            height: auto;
            margin: 10px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Happy Birthday!!! 🎉💖</h1>

        <div class="note">
            🌸 It’s officially your day! 🎉  
            I hope your birthday is filled with smiles, cake, and everything you love, sweetu.  
            You deserve it all ❤️
        </div>

        <div class="gallery">
            <h2>Your Coloring & Smile ✨</h2>
            <img src="20251117_134802.jpg" alt="Her coloring">
            <img src="20251209_134333.jpg" alt="Her art">
        </div>

        <div class="cake">
            <h2>Birthday Cake 🎂</h2>
            <img src="ai-generated-9083277_1920.jpg" alt="Birthday Cake">
        </div>

    </div>
</body>
</html>
