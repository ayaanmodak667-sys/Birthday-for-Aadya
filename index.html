<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday [Her Name]!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5; /* soft pastel background */
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            padding: 30px;
        }
        h1 {
            color: #ff69b4; /* pinkish heading */
        }
        .note {
            max-width: 600px;
            margin: 20px auto;
            font-size: 18px;
            line-height: 1.5;
            text-align: left;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .gallery img {
            width: 150px;
            margin: 10px;
            border-radius: 10px;
        }
        .cake {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Birthday, [Her Name]!</h1>

        <div class="note">
            <!-- Paste your handwritten note text here -->
            [Your note goes here…]
        </div>

        <div class="gallery">
            <h2>Your Art & Coloring</h2>
            <img src="image1.jpg" alt="Her coloring">
            <img src="image2.jpg" alt="Her art">
            <!-- Add more images if you like -->
        </div>

        <div class="cake">
            <h2>Birthday Cake!</h2>
            <img src="cake-diagram.jpg" alt="Birthday Cake">
        </div>
    </div>
</body>
</html>
